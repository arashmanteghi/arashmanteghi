<text x="32" y="82" font-size="15" class="m">$ echo $USER</text>
<text x="32" y="122" font-size="34" class="b">Arash Manteghi<tspan class="acc" style="animation:blink 1s step-end infinite">_</tspan></text>
<text x="32" y="156" font-size="15" class="m">Software Developer</text>
<circle cx="690" cy="152" r="4" class="acc" style="animation:pulse 2s ease-in-out infinite"/>
